<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistem Akuntansi Petty Cash KJA</title>
  <!--
    Root redirect page — GitHub Pages dan file:// meletakkan pengguna di sini,
    lalu otomatis mengarahkan ke frontend/ tempat aplikasi sebenarnya berada.
    Halaman ini tidak mengandung logic aplikasi apa pun.
  -->
  <meta http-equiv="refresh" content="0;url=frontend/">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', 'Inter', Arial, sans-serif;
      background: linear-gradient(135deg, #3b0f13 0%, #59171b 35%, #7a3236 65%, #b97a72 100%);
      color: #fff8f1;
      text-align: center;
    }
    a.button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 700;
      color: #59171b;
      background: linear-gradient(115deg, #fed7b8, #f3b9a0);
      border: 1.5px solid rgba(255, 255, 255, .6);
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 10px 28px rgba(53, 16, 24, .22);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    a.button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(53, 16, 24, .3);
    }
    .note {
      margin-top: 24px;
      font-size: 12px;
      opacity: .8;
    }
  </style>
</head>
<body>
  <div>
    <a href="frontend/" class="button">Buka aplikasi →</a>
    <p class="note">Jika Anda tidak dialihkan secara otomatis.</p>
  </div>
</body>
</html>
